name: Check dormant library publication code

on:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing PDF system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install existing pinned dependencies
        run: pip install -r requirements.txt
      - name: Require the complete portable Owner guard tests before discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ['test_owner_absence_seo.py', 'test_owner_final_stub_dispatch.py', 'test_owner_post_s5_contract.py', 'test_owner_repair_four_facts.py', 'test_owner_repair_integration.py', 'test_owner_repair_policy.py', 'test_owner_repair_render_pdf.py', 'test_owner_repair_six_facts.py', 'test_owner_repair_stage_media.py']
          missing = [name for name in required if not (Path('tests')/name).is_file()]
          if missing:
              raise SystemExit('Missing required Owner guard tests: ' + ', '.join(missing))
          if not Path('tests/fixtures/owner-repair').is_dir():
              raise SystemExit('Portable Owner fixtures are missing')
          PY
      - name: Check the complete Python suite including portable Owner guards
        env:
          BW_OVERLAY_SUPPORT_REPO: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'
