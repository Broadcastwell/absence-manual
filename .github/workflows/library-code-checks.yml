name: Check dormant library publication code

on:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing PDF system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install existing pinned dependencies
        run: pip install -r requirements.txt
      - name: Check the complete Python suite without activating publication
        env:
          BW_OVERLAY_SUPPORT_REPO: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'
