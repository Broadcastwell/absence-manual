name: Verify manual pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the system libraries the PDF renderer needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Build site
        run: mkdocs build
      - name: Build the ungated PDF mirror from the same source
        run: python tools/build_pdf.py
      - name: Verify the build is ungated and crawlable
        run: python tools/verify_build.py
