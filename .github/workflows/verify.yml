name: Verify manual pull request

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the system libraries the PDF renderer needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify shared chrome and responsive disclosure behavior
        run: node --test tests/site-chrome.test.mjs tests/manual-controls.test.mjs
      - name: Verify production artifact rejection guards
        run: python -m unittest discover -s tests -p 'test_verified_preview.py'
      - name: Verify answer library rules and generated source index
        run: |
          python -m unittest discover -s tests -p 'test_answers.py'
          python -m unittest discover -s tests -p 'test_answers_published_audit.py'
          python -m unittest discover -s tests -p 'test_answers_published_audit_extension.py'
          python -m unittest discover -s tests -p 'test_answers_published_list_audit.py'
          python -m unittest discover -s tests -p 'test_answers_documentation_review.py'
          python -m unittest discover -s tests -p 'test_library_related_chapters.py'
          python -m unittest discover -s tests -p 'test_library_field_freeze_navigation.py'
          python -m unittest discover -s tests -p 'test_research_study_closing.py'
          python -m unittest discover -s tests -p 'test_pdf_reproducible_fonts.py'
          python tools/generate_answers_llms.py --check
          python tools/verify_answers.py --check-external --receipt answer-link-check.json
      - name: Download the exact reviewed prior publication artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const plan = JSON.parse(fs.readFileSync('tools/library-publication/release.json', 'utf8'));
            if (plan.approved !== true || plan.prior_artifact_id !== 13228384449) throw new Error('Unreviewed prior artifact identity');
            const {owner, repo} = context.repo;
            const meta = (await github.rest.actions.getArtifact({owner, repo, artifact_id: plan.prior_artifact_id})).data;
            if (meta.expired || meta.name !== 'manual-site-preview' || meta.digest !== 'sha256:' + plan.prior_artifact_sha256) throw new Error('Prior artifact metadata differs');
            const zip = (await github.rest.actions.downloadArtifact({owner, repo, artifact_id: plan.prior_artifact_id, archive_format: 'zip'})).data;
            const bytes = Buffer.from(zip);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== plan.prior_artifact_sha256) throw new Error('Prior artifact bytes differ');
            fs.writeFileSync('reviewed-prior-publication.zip', bytes);
      - name: Stage only the exact Root-reviewed library inputs
        run: python tools/library_publication_stage.py --blueprint tools/library-publication/release.json --artifact reviewed-prior-publication.zip --out .library-publication-staged --docs docs --write-github-env
      - name: Build site
        run: mkdocs build
      - name: Verify whole-library similarity, openings, lead facts and uniqueness
        run: |
          python -m unittest discover -s tests -p 'test_library_quality.py'
          python tools/library_quality.py --report library-quality-report.json
      - name: Build the ungated PDF mirror from the same source
        run: |
          python tools/build_pdf.py
          cp site/absence-manual.pdf /tmp/first-manual.pdf
          python tools/build_pdf.py
          cmp /tmp/first-manual.pdf site/absence-manual.pdf
      - name: Verify the complete effective collection and bounded public artifact changes
        run: python tools/library_publication_build.py --inputs "$BW_LIBRARY_PUBLICATION_INPUTS" --inputs-sha256 "$BW_LIBRARY_PUBLICATION_INPUTS_SHA256" --docs docs --site site --work .library-publication-work > library-bounded-release-result.json
      - name: Save the actual whole-collection and bounded-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-bounded-release-review
          include-hidden-files: true
          path: |
            library-bounded-release-result.json
            .library-publication-work/whole-current-report.json
            .library-publication-work/complete-artifact-comparison.json
            .library-publication-work/bounded-release-result.json
            .library-publication-work/compiled-state.json
          if-no-files-found: warn
      - name: Verify the build is ungated and crawlable
        run: |
          python tools/verify_build.py
          python tools/verify_library_field_freeze.py --docs docs --site site --map tools/library_field_freeze_navigation.json --map-sha256 e8d4688604fdcb57e38944ce6937ce7fa788da73ec96b77902042990f8806f4c
      - name: Save the complete site preview
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          pathlib.Path('site/relaunch-build-provenance.json').write_text(json.dumps({
              'source_head': os.environ['SOURCE_HEAD'],
              'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }))
          PY
      - name: Upload the complete verified site
        uses: actions/upload-artifact@v4
        with:
          name: manual-site-preview
          path: site

      - name: Save the finite field-freeze verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-field-freeze-review
          path: library-field-freeze-retention.json
          if-no-files-found: warn
