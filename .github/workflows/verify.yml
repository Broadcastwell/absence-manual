name: Verify manual pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the system libraries the PDF renderer needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify shared chrome and responsive disclosure behavior
        run: node --test tests/site-chrome.test.mjs tests/manual-controls.test.mjs
      - name: Select the explicit reviewed publication mode
        id: mode
        run: echo "mode=$(python tools/library_research_activation.py mode --repo .)" >> "$GITHUB_OUTPUT"
      - name: Verify production artifact rejection guards
        run: python -m unittest discover -s tests -p 'test_verified_preview.py'
      - name: Verify Research activation and inherited publication guards
        run: |
          python -m unittest discover -s tests -p 'test_research*.py'
          python -m unittest discover -s tests -p 'test_published_discovery_consumer_five.py'
      - name: Verify answer library rules and generated source index
        run: |
          python -m unittest discover -s tests -p 'test_answers.py'
          python -m unittest discover -s tests -p 'test_answers_published_audit.py'
          python -m unittest discover -s tests -p 'test_answers_published_audit_extension.py'
          python -m unittest discover -s tests -p 'test_answers_published_list_audit.py'
          python -m unittest discover -s tests -p 'test_answers_documentation_review.py'
          python -m unittest discover -s tests -p 'test_library_related_chapters.py'
          python -m unittest discover -s tests -p 'test_library_field_freeze_navigation.py'
          python -m unittest discover -s tests -p 'test_research_study_closing.py'
          python -m unittest discover -s tests -p 'test_pdf_reproducible_fonts.py'
          python tools/generate_answers_llms.py --check
          python tools/verify_answers.py --check-external --receipt answer-link-check.json
      - name: Download the exact reviewed PR93 publication artifact
        if: steps.mode.outputs.mode == 'owner'
        id: prior
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const approval = JSON.parse(fs.readFileSync('tools/library-owner-repair/ROOT_BLUEPRINT_APPROVAL.json', 'utf8'));
            const blueprintPath = 'tools/library-owner-repair/release.json';
            const expectedId = 13277324668;
            const expectedSha = '04b35fe2e233e95266c359094c6c242bfc58c4c1a7657d22da09dd827ba71d01';
            if (approval.schema_version !== 1 || approval.approved !== true || approval.reviewer !== 'root' ||
                approval.review_kind !== 'root-reviewed-portable-owner-blueprint' ||
                approval.blueprint?.path !== blueprintPath || !/^[0-9a-f]{64}$/.test(approval.blueprint?.sha256 ?? '') ||
                !/^[0-9a-f]{64}$/.test(approval.actual_Root_read_record_sha256 ?? '') ||
                approval.prior_artifact?.id !== expectedId || approval.prior_artifact?.sha256 !== expectedSha) {
              throw new Error('Actual Root-reviewed portable Owner blueprint/proof is missing or different');
            }
            const blueprintBytes = fs.readFileSync(blueprintPath);
            const blueprint = JSON.parse(blueprintBytes);
            if (crypto.createHash('sha256').update(blueprintBytes).digest('hex') !== approval.blueprint.sha256 ||
                blueprint.approved !== true || blueprint.review_kind !== 'root-exact-owner-repair-inputs' ||
                blueprint.prior_artifact?.sha256 !== expectedSha) throw new Error('Portable Owner blueprint bytes/scope differ');
            const {owner, repo} = context.repo;
            const meta = (await github.rest.actions.getArtifact({owner, repo, artifact_id: expectedId})).data;
            if (meta.expired || meta.name !== 'manual-site-preview' || meta.digest !== 'sha256:' + expectedSha) {
              throw new Error('Actual PR93 prior artifact metadata differs');
            }
            const zip = (await github.rest.actions.downloadArtifact({owner, repo, artifact_id: expectedId, archive_format: 'zip'})).data;
            const bytes = Buffer.from(zip);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== expectedSha) throw new Error('Actual PR93 prior artifact bytes differ');
            fs.writeFileSync('reviewed-prior-publication.zip', bytes);
            core.setOutput('blueprint-sha256', approval.blueprint.sha256);
      - name: Stage only the exact Root-reviewed portable Owner inputs
        if: steps.mode.outputs.mode == 'owner'
        run: |
          python tools/library_owner_repair_stage.py --blueprint tools/library-owner-repair/release.json --blueprint-sha256 '${{ steps.prior.outputs.blueprint-sha256 }}' --artifact reviewed-prior-publication.zip --out .owner-repair-staged --docs docs --write-github-env > owner-stage-result.json
      - name: Download the exact Research prior publication artifact
        if: steps.mode.outputs.mode == 'research' || steps.mode.outputs.mode == 'activation'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const plan = JSON.parse(fs.readFileSync('tools/library-research-support.json','utf8'));
            const id = plan.activation_delivery.prior_artifact_id;
            const expected = plan.activation_delivery.external_files['.library-research-work/prior-public.zip'];
            const {owner,repo} = context.repo;
            const meta = (await github.rest.actions.getArtifact({owner,repo,artifact_id:id})).data;
            if (meta.expired || meta.name !== 'manual-site-preview' || meta.digest !== 'sha256:'+expected) throw new Error('Research prior artifact metadata differs');
            const bytes = Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:id,archive_format:'zip'})).data);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== expected) throw new Error('Research prior artifact bytes differ');
            fs.writeFileSync('reviewed-prior-publication.zip',bytes);
      - name: Download the two exact follow-up baselines
        if: steps.mode.outputs.mode == 'followup'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const plan = JSON.parse(fs.readFileSync('tools/library-followup-20261105.json','utf8'));
            const old = JSON.parse(fs.readFileSync('tools/library-research-support.json','utf8'));
            for (const row of [
              [plan.prior_artifact_id, plan.prior_artifact_sha256, plan.prior_artifact_path],
              [old.activation_delivery.prior_artifact_id, old.activation_delivery.external_files['.library-research-work/prior-public.zip'], 'reviewed-prior-publication.zip']
            ]) {
              const {owner,repo}=context.repo, [id,expected,destination]=row;
              const meta=(await github.rest.actions.getArtifact({owner,repo,artifact_id:id})).data;
              if(meta.expired || meta.name!=='manual-site-preview' || meta.digest!=='sha256:'+expected) throw new Error('Follow-up baseline metadata differs');
              const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(bytes).digest('hex')!==expected) throw new Error('Follow-up baseline bytes differ');
              fs.writeFileSync(destination,bytes);
            }
      - name: Stage the immutable released Research route for the finite follow-up
        if: steps.mode.outputs.mode == 'followup'
        run: |
          python tools/library_followup_release.py prepare --repo . --artifact reviewed-pr97-publication.zip --baseline-artifact reviewed-prior-publication.zip
          echo "BW_LIBRARY_FOLLOWUP_PLAN_SHA256=$(tr -d '\r\n' < tools/library-followup-20261105.sha256)" >> "$GITHUB_ENV"
      - name: Stage the exact Research inputs through library_research_stage.py
        if: steps.mode.outputs.mode == 'research'
        run: python tools/library_research_activation.py prepare --repo . --artifact reviewed-prior-publication.zip --write-github-env > research-stage-result.json
      - name: Preserve exact production bytes for the code-only activation
        if: steps.mode.outputs.mode == 'activation'
        run: python tools/library_research_activation.py public-identity --repo . --artifact reviewed-prior-publication.zip
      - name: Build site in the explicit reviewed mode
        if: steps.mode.outputs.mode != 'activation'
        run: mkdocs build --strict
      - name: Verify whole-library similarity, openings, lead facts and uniqueness
        run: |
          python -m unittest discover -s tests -p 'test_library_quality.py'
          python tools/library_quality.py --report library-quality-report.json
      - name: Build the ungated PDF mirror twice from the same source
        if: steps.mode.outputs.mode != 'activation'
        run: |
          python tools/build_pdf.py
          cp site/absence-manual.pdf /tmp/first-manual.pdf
          python tools/build_pdf.py
          cmp /tmp/first-manual.pdf site/absence-manual.pdf
      - name: Capture actual unapproved post-PDF candidate observations
        if: steps.mode.outputs.mode == 'owner'
        run: |
          python tools/observe_owner_candidate.py --inputs "$BW_OWNER_REPAIR_INPUTS" --inputs-sha256 "$BW_OWNER_REPAIR_INPUTS_SHA256" --docs docs --site site --work .owner-repair-work > owner-candidate-observation.NOT_APPROVED.json
      - name: Verify the build is ungated and crawlable
        if: steps.mode.outputs.mode != 'activation'
        run: |
          python tools/verify_build.py
          python tools/verify_library_field_freeze.py --docs docs --site site --map tools/library_field_freeze_navigation.json --map-sha256 ec8e3d76d21ee607974ffa5c2e7c82eb75c3d17f8b727e62d8d35d37830d91f7
      - name: Verify all frozen bytes in the unchanged activation publication
        if: steps.mode.outputs.mode == 'activation'
        run: python tools/verify_library_field_freeze.py --docs docs --site site --map tools/library_field_freeze_navigation.json --map-sha256 ec8e3d76d21ee607974ffa5c2e7c82eb75c3d17f8b727e62d8d35d37830d91f7
      - name: Verify the complete finite Owner repair and actual artifact evidence
        if: steps.mode.outputs.mode == 'owner'
        run: |
          python tools/library_owner_repair_build.py --inputs "$BW_OWNER_REPAIR_INPUTS" --inputs-sha256 "$BW_OWNER_REPAIR_INPUTS_SHA256" --docs docs --site site --work .owner-repair-work > owner-repair-result.json
      - name: Verify the complete finite Research release
        if: steps.mode.outputs.mode == 'research'
        run: python tools/library_research_build.py --inputs "$BW_RESEARCH_RELEASE_INPUTS" --inputs-sha256 "$BW_RESEARCH_RELEASE_INPUTS_SHA256" --docs docs --site site --work .library-research-work/render > research-release-result.json
      - name: Verify the complete finite follow-up source and artifact approval
        if: steps.mode.outputs.mode == 'followup'
        run: python tools/library_followup_release.py verify --repo .
      - name: Save clearly unapproved candidate site and actual observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-repair-candidate-UNAPPROVED
          include-hidden-files: true
          path: |
            site/
            .owner-repair-work/
            owner-stage-result.json
            owner-candidate-observation.NOT_APPROVED.json
            owner-repair-result.json
            activation-public-identity.json
            library-quality-report.json
            followup-candidate-observation.NOT_APPROVED.json
            followup-release-result.json
            .library-followup-work/source-proof.json
            .library-followup-work/render-contexts.json
            library-field-freeze-retention.json
          if-no-files-found: warn
      - name: Save the complete verified site provenance
        if: success()
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          pathlib.Path('site/relaunch-build-provenance.json').write_text(json.dumps({
              'source_head': os.environ['SOURCE_HEAD'],
              'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }))
          PY
      - name: Upload the complete verified site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manual-site-preview
          path: site

  research_candidate:
    name: Verify the exact prepared Research publishing route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the existing PDF dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
          pip install -r requirements.txt
      - name: Check whether this is the activation or Research publication
        id: mode
        run: echo "mode=$(python tools/library_research_activation.py mode --repo .)" >> "$GITHUB_OUTPUT"
      - name: Download the exact verified prior publication
        if: steps.mode.outputs.mode == 'activation'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const plan = JSON.parse(fs.readFileSync('tools/library-research-support.json','utf8'));
            const id = plan.activation_delivery.prior_artifact_id;
            const expected = plan.activation_delivery.external_files['.library-research-work/prior-public.zip'];
            const {owner,repo} = context.repo;
            const meta = (await github.rest.actions.getArtifact({owner,repo,artifact_id:id})).data;
            if (meta.expired || meta.name !== 'manual-site-preview' || meta.digest !== 'sha256:'+expected) throw new Error('Research prior artifact metadata differs');
            const bytes = Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:id,archive_format:'zip'})).data);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== expected) throw new Error('Research prior artifact bytes differ');
            fs.writeFileSync('reviewed-prior-publication.zip',bytes);
      - name: Stage the stable sixty-file candidate in an unpublished directory
        if: steps.mode.outputs.mode == 'activation'
        run: python tools/library_research_activation.py prepare --repo . --artifact reviewed-prior-publication.zip --candidate-check --write-github-env > research-stage-result.json
      - name: Build and verify the prepared Research route
        if: steps.mode.outputs.mode == 'activation'
        working-directory: .research-candidate-check
        run: |
          python docs/research/data/research_release_gate.py .
          mkdocs build --strict
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          from library_publication_generated_pdf import manual_inputs
          candidate=Path.cwd()
          inputs=manual_inputs(candidate)
          assert inputs==manual_inputs(candidate.parent), 'Manual source differs between exercise and actual checkout'
          Path('.library-research-work/render/manual-input-identity.json').write_text(json.dumps({'actual_inputs':inputs,'all_inputs_exact':True,'reason':'Build from the actual checkout so image resource URLs retain their original identities.'},indent=2))
          PY
          python ../tools/build_pdf.py
          cp ../site/absence-manual.pdf /tmp/research-first-manual.pdf
          python ../tools/build_pdf.py
          cmp /tmp/research-first-manual.pdf ../site/absence-manual.pdf
          cp ../site/absence-manual.pdf site/absence-manual.pdf
          cp ../site/absence-manual-v1.0-2026-08-18.pdf site/absence-manual-v1.0-2026-08-18.pdf
          python tools/verify_build.py
          python tools/verify_library_field_freeze.py --docs docs --site site --map tools/library_field_freeze_navigation.json --map-sha256 ec8e3d76d21ee607974ffa5c2e7c82eb75c3d17f8b727e62d8d35d37830d91f7
          python tools/library_research_build.py --inputs "$BW_RESEARCH_RELEASE_INPUTS" --inputs-sha256 "$BW_RESEARCH_RELEASE_INPUTS_SHA256" --docs docs --site site --work .library-research-work/render > research-release-result.json
      - name: Preserve the unpublished Research route evidence
        if: always() && steps.mode.outputs.mode == 'activation'
        uses: actions/upload-artifact@v4
        with:
          name: research-route-candidate-UNPUBLISHED
          include-hidden-files: true
          path: |
            research-stage-result.json
            .research-candidate-check/site/
            .research-candidate-check/.library-research-work/render/
            .research-candidate-check/research-release-result.json
          if-no-files-found: warn
