site_name: The Absence Manual
site_url: https://docs.broadcastwell.com/
site_description: A free technical manual on AI search visibility for B2B software, built from three published open datasets. One chapter per URL, no gate, no login.
site_author: Sairam Sivakumar
repo_url: https://github.com/Broadcastwell/absence-manual
repo_name: Broadcastwell/absence-manual
edit_uri: ""
copyright: Version 1.0, August 2026. Prose and figures CC BY 4.0. Site code MIT.

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.action.none
    - toc.follow
  palette:
    scheme: default
    primary: black
    accent: indigo
  font: false

extra:
  manual_version: "1.0"
  manual_version_label: "Version 1.0, August 2026"
  social: []
  generator: false

extra_css:
  - assets/manual.css

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition

plugins:
  - search

nav:
  - The Absence Manual: index.md
  - Chapter 2. The Absence Ladder: absence-ladder.md
  - Chapter 6. Your Score Is Noisier Than Your Vendor Admits: measurement-noise.md
  - Note. Same score, different problem: posts/same-score-different-problem.md
  - Note. Half its own shortlist: posts/half-its-own-shortlist.md
